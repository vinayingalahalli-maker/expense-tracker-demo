[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expense_tracker_api_sdk"
version = "1.0.0"
description = """API collection for the Expense Tracker Service at Northbeam Consulting.\nCovers Categories, Expenses, and Claims with JWT Bearer auth.\n\nRoles: Employee, Approver, Finance"""
readme = "PyPI_README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0,<3.0.0"
]
