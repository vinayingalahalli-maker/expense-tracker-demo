$kind: http-request
name: Update Category
method: PUT
url: '{{base_url}}/categories/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{category_id}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Travel",
      "description": "Flights, hotels, ground transport and car hire",
      "receipt_threshold": 75.00
    }
examples: './.resources/Update Category.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Response has an id", () => pm.expect(pm.response.json()).to.have.property("id"));
      pm.test("Response time is under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
