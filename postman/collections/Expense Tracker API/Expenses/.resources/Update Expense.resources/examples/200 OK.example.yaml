$kind: http-example
name: 200 OK
request:
  url: '{{base_url}}/expenses/exp_001'
  method: PUT
  body:
    type: json
    content: |-
      {
        "amount": 55.00,
        "currency": "USD",
        "date": "2026-11-10",
        "description": "Taxi to client site (updated fare)",
        "receipt_url": "https://receipts.example.com/r/abc123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": "exp_001",
        "category_id": "cat_001",
        "amount": 55.00,
        "currency": "USD",
        "date": "2026-11-10",
        "description": "Taxi to client site (updated fare)",
        "receipt_url": "https://receipts.example.com/r/abc123",
        "status": "unclaimed"
      }
