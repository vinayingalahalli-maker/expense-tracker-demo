$kind: http-example
name: 409 Invalid State
request:
  url: '{{base_url}}/claims/clm_001/submit'
  method: POST
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "invalid_state_transition",
        "message": "Claim clm_001 is already submitted and cannot be submitted again"
      }
