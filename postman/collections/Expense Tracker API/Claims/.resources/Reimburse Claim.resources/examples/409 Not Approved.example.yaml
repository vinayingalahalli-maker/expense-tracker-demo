$kind: http-example
name: 409 Not Approved
request:
  url: '{{base_url}}/claims/clm_001/reimburse'
  method: POST
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "invalid_state_transition",
        "message": "Only approved claims can be reimbursed"
      }
