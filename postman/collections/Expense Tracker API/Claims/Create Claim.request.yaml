$kind: http-request
name: Create Claim
method: POST
url: '{{base_url}}/claims'
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "November Business Trip",
      "expense_ids": ["{{expense_id}}"]
    }
examples: './.resources/Create Claim.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", () => pm.response.to.have.status(201));
      pm.test("Response has an id", () => pm.expect(pm.response.json()).to.have.property("id"));
      pm.test("Response time is under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
